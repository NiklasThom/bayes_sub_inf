[tool.poetry]
name = "subspace_inference"
version = "0.1.0"
description = "Subspace Inference for Bayesian Neural Networks in JAX"
authors = ["Daniel <ddold@htwg-konstanz.de>"]
readme = "README.md"
packages = [{include = "subspace_inference"}]

[tool.poetry.dependencies]
python = "^3.10,<3.12"
flax = "^0.10.0"
jax = {version = "^0.5.0", extras = ["cuda12"], source = "jax"} # upgrade jax with command: poetry run pip install --upgrade "jax[cuda12_local]==0.5.3" "flax==0.10.5"
wandb = "^0.17.8"
jax-tqdm = "^0.2.2"
einshape = "^1.0"
numpyro = "^0.15.0"
optax = "^0.2.0"
jaxopt = "^0.8.5"
scipy = "^1.10.0"

# Visualization and Jupyter (Optional)
ipywidgets = {version = "^8.1.3", optional = true}
widgetsnbextension = {version = "^4.0.11", optional = true}
seaborn = {version = "^0.13.2", optional = true}
ipykernel = {version = "^6.29.5", optional = true}
pandas = {version = "^2.2.2", optional = true}
arviz = {version = "^0.18.0", optional = true}
matplotlib = {version = "^3.9.0", optional = true}
notebook = {version = "^7.2.1", optional = true}
graphviz = {version = "^0.21", optional = true}
hvplot = {version = "^0.12.1", optional = true}
datashader = {version = "^0.18.2", optional = true}
jupyter-bokeh = {version = "^4.0.5", optional = true}

[tool.poetry.extras]
viz = [
    "ipywidgets",
    "widgetsnbextension",
    "seaborn",
    "ipykernel",
    "pandas",
    "arviz",
    "matplotlib",
    "notebook",
    "graphviz",
    "hvplot",
    "datashader",
    "jupyter-bokeh"
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

[[tool.poetry.source]]
name = "jax"
url = "https://storage.googleapis.com/jax-releases/jax_releases.html"
priority = "explicit"

[[tool.poetry.source]]
name = "jaxlib"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
