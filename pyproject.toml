[project]
name = "subspace_inference"
version = "0.1.0"
description = "Subspace Inference for Bayesian Neural Networks in JAX"
authors = [{name = "Daniel", email = "ddold@htwg-konstanz.de"}]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "flax>=0.10.0,<0.11.0",
    "jax[cuda12]==0.5.3",
    "wandb>=0.17.8,<0.18.0",
    "jax-tqdm>=0.2.2,<0.3.0",
    "einshape>=1.0,<2.0",
    "optax>=0.2.0,<0.3.0",
    "jaxopt>=0.8.5,<0.9.0",
    "scipy>=1.10.0,<2.0.0",
    "jaxlib==0.5.3",
    "datasets>=5.0.0",
]

[project.optional-dependencies]
viz = [
    "ipywidgets>=8.1.3,<9.0.0",
    "widgetsnbextension>=4.0.11,<5.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "pandas>=2.2.2,<3.0.0",
    "arviz>=0.18.0,<0.19.0",
    "matplotlib>=3.9.0,<4.0.0",
    "notebook>=7.2.1,<8.0.0",
    "graphviz>=0.21,<1.0.0",
    "hvplot>=0.12.1,<0.13.0",
    "datashader>=0.18.2,<0.19.0",
    "jupyter-bokeh>=4.0.5,<5.0.0",
]
torch = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ipykernel>=6.29.5,<7.0.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
